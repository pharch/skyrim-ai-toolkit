name: Research harness CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Offline research validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Python tests
        run: python -m pytest tests/ -q
      - name: Node tests
        run: npm test
      - name: Python and shell syntax
        run: |
          python -m compileall -q scripts tools tests
          while IFS= read -r script; do bash -n "$script"; done < <(git ls-files '*.sh')
      - name: Durable evidence and frontier validation
        run: python scripts/validate_research.py
      - name: Repository readiness gate
        run: python scripts/validate_overlay.py

  windows-policy-fixtures:
    name: Windows path-policy fixtures (not game integration)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: AE targeting and recovery policy fixtures
        run: |
          python -m pytest tests/test_skyrim_paths.py tests/test_setup_research.py tests/test_validate_research.py tests/test_research_supervisor.py -q
          npm test
        shell: pwsh
