name: Research harness CI

on:
  push:
    branches: [main, master, glitch-hunting-setup]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Offline research validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Python tests
        run: python -m pytest tests/ -q
      - name: Python syntax
        run: python -m compileall -q scripts tools tests
      - name: Durable evidence and frontier validation
        run: python scripts/validate_research.py
      - name: Repository readiness gate
        run: python scripts/validate_overlay.py

  windows-policy-fixtures:
    name: Windows path-policy fixtures (not game integration)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: AE targeting and recovery policy fixtures
        run: python -m pytest tests/test_ae_target.py tests/test_python_env.py tests/test_research_state.py tests/test_setup_research.py tests/test_validate_research.py -q
        shell: pwsh
